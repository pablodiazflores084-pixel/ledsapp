name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: unzip LucesLED.zip
      - run: cd LucesLED && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LucesLED/app/build/outputs/apk/debug/app-debug.apk
